<!DOCTYPE html>
<html>
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Login Test</h2>
  <div id="g_id_onload"
       data-client_id="774600933127-dqjr0oopeqmflah8adfbmegb2e2dlp29.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    function handleCredentialResponse(response) {
      console.log("idToken:", response.credential);
      document.body.innerHTML += "<textarea style='width:100%;height:200px'>" + response.credential + "</textarea>";
    }
  </script>
</body>
</html>
